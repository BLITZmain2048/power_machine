name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.extra }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        extra: [standard, fast]
    env:
      OPENBLAS_NUM_THREADS: "1"
      POWER_MACHINE_OUTPUT_DIR: ${{ runner.temp }}/power-machine-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install standard test dependencies
        if: matrix.extra == 'standard'
        run: python -m pip install -e ".[dev]"
      - name: Install fast test dependencies
        if: matrix.extra == 'fast'
        run: python -m pip install -e ".[dev,fast]"
      - name: Run non-GUI tests
        run: python -m pytest -m "not gui"

  package:
    name: Build and install distributions
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      POWER_MACHINE_OUTPUT_DIR: ${{ runner.temp }}/power-machine-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Test installed distributions outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            environment="$RUNNER_TEMP/power-machine-$(basename "$artifact")"
            python -m venv "$environment"
            "$environment/bin/python" -m pip install "$GITHUB_WORKSPACE/$artifact"
            cd "$RUNNER_TEMP"
            "$environment/bin/power-machine" doctor
            "$environment/bin/power-machine" lf ieee39 --json
            "$environment/bin/python" "$GITHUB_WORKSPACE/examples/01_flujo_ieee39.py"
          done

  validation:
    name: Full validation evidence
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      POWER_MACHINE_OUTPUT_DIR: ${{ runner.temp }}/power-machine-validation-output
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev,fast]"
      - name: Run full validation
        run: python -m validation
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation/results/
          if-no-files-found: warn
